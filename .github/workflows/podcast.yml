name: Pubblica episodio

on:
  push:
    branches: [main]
    paths: ["episodes/**", "config.yml", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q edge-tts piper-tts pyyaml pillow

      - name: Cache voce Piper
        uses: actions/cache@v4
        with:
          path: .voices
          key: piper-${{ hashFiles('config.yml') }}

      - name: Genera audio e feed
        run: python scripts/build.py

      - name: Salva audio e feed nel repository
        run: |
          git config user.name "rassegna-bot"
          git config user.email "rassegna-bot@users.noreply.github.com"
          git add -A docs episodes
          git diff --cached --quiet || git commit -m "Episodio e feed aggiornati [skip ci]"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
