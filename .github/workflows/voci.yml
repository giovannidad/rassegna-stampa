name: Campioni voci

on:
  push:
    branches: [main]
    paths: ["scripts/voice_samples.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts piper-tts
      - name: Genera campioni
        run: python scripts/voice_samples.py
      - name: Salva campioni
        run: |
          git config user.name "rassegna-bot"
          git config user.email "rassegna-bot@users.noreply.github.com"
          git pull -q --rebase
          git add samples
          git diff --cached --quiet || git commit -m "Campioni voci [skip ci]"
          git push
