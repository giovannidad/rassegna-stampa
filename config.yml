# Configurazione del podcast "Rassegna Stampa"
title: "Rassegna Stampa"
description: "Una breve rassegna stampa indipendente che in meno di 10 minuti ti tiene informato sulle notizie più importanti del giorno"
author: "Rassegna Stampa"
language: "it-IT"

# Voce principale (Edge TTS). Alternative: it-IT-DiegoNeural, it-IT-ElsaNeural
edge_voice: "it-IT-IsabellaNeural"
edge_rate: "+5%"

# Voce di riserva (Piper), usata solo se Edge TTS fallisce
piper_voice: "it_IT-paola-medium"

# Quanti episodi tenere online (i più vecchi vengono rimossi)
keep_episodes: 10
